{{- if .Values.llama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xlsform-builder.llamaFullname" . }}
  labels:
    {{- include "xlsform-builder.labels" . | nindent 4 }}
    app.kubernetes.io/component: llama
spec:
  replicas: {{ .Values.replicaCount.llama }}
  selector:
    matchLabels:
      {{- include "xlsform-builder.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llama
  template:
    metadata:
      labels:
        {{- include "xlsform-builder.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llama
    spec:
      containers:
        - name: llama
          image: "{{ .Values.image.llama.repository }}:{{ .Values.image.llama.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.llama.pullPolicy }}
          args:
            - "-m"
            - "/models/{{ .Values.llama.modelFilename }}"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - {{ .Values.service.llama.port | quote }}
            - "--ctx-size"
            - "4096"
            - "--n-predict"
            - "2048"
            - "-ngl"
            - "35"
          ports:
            - name: http
              containerPort: {{ .Values.service.llama.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.llama | nindent 12 }}
{{- end }}
